# Integración continua (Trunk Based Development): cada push a main y cada pull
# request instala dependencias, ejecuta las pruebas, compila y construye la imagen.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias (Vitest)
        run: npx ng test --watch=false
      - name: Compilación de producción
        run: npx ng build
      - name: Imagen Docker
        run: docker build -t foro-web:ci .
