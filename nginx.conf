# nginx para la SPA de Angular.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los archivos con hash en el nombre se pueden guardar en caché por un año.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta (/login, /temas/3, /admin/usuarios…) la resuelve el
    # router de Angular: se devuelve index.html. Sin esto, recargar la página
    # en una ruta interna daría 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
